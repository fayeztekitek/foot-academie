version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nadi-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-nadi}
      POSTGRES_USER: ${DB_USERNAME:-nadi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - nadi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nadi} -d ${DB_NAME:-nadi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nadi-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nadi-backend-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nadi}
      DB_USERNAME: ${DB_USERNAME:-nadi}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      firebase.enabled: ${FIREBASE_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nadi-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nadi-frontend-prod
    restart: always
    depends_on:
      - backend
    networks:
      - nadi-net

  nginx:
    image: nginx:alpine
    container_name: nadi-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nadi-net

  certbot:
    image: certbot/certbot
    container_name: nadi-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - nadi-net

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: nadi-backup
    restart: always
    depends_on:
      - db
    environment:
      DB_CONTAINER: db
      DB_NAME: ${DB_NAME:-nadi}
      DB_USER: ${DB_USERNAME:-nadi}
      RETENTION_DAYS: 30
    volumes:
      - nadi-backups:/backups/nadi
    networks:
      - nadi-net

volumes:
  nadi-pgdata:
  nadi-backups:

networks:
  nadi-net:
    driver: bridge

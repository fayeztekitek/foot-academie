<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#122A22" />
    <meta name="description" content="Nadi — Application de gestion pour académie de football" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <title>Nadi — Académie de Football</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Boot diagnostic: if React fails to mount (e.g. broken cached assets
      // in the native WebView), show the error instead of a blank screen.
      (function () {
        var started = Date.now();
        function fail(msg) {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            root.innerHTML =
              '<div style="font-family:sans-serif;padding:24px;color:#7a1f1f">' +
              '<h3>Erreur de démarrage</h3><p>' + msg + '</p>' +
              '<p style="font-size:12px">Désinstallez puis réinstallez l\'application, puis réessayez.</p></div>';
          }
        }
        window.addEventListener('error', function (e) {
          console.error('[boot-error]', e.message, e.filename);
          if (Date.now() - started < 15000) fail('Script: ' + (e.message || 'erreur inconnue'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          console.error('[boot-rejection]', e.reason);
        });
        setTimeout(function () { fail('L\'application n\'a pas démarré.'); }, 15000);
      })();
    </script>
  </body>
</html>
